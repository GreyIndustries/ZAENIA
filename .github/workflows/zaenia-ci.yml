
name: ZAENIA Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zaenia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    name: Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python files
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = [
              Path("core"),
              Path("utils"),
              Path("scripts"),
          ]

          total = 0

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*.py"):
                  with path.open(
                      "r", encoding="utf-8-sig"
                  ) as f:
                      ast.parse(
                          f.read(),
                          filename=str(path)
                      )
                  total += 1

          print(f"Validated {total} Python files")
          PY

  desktop-build:
    name: React Desktop Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
