<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ZÆNIA Neural Core blended with a black hole</title>
  <desc id="desc">A luminous neural sphere and orbital network fold around a dark event horizon, surrounded by a gold and blue accretion disk.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="49%" r="75%">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset=".45" stop-color="#07101f"/>
      <stop offset="1" stop-color="#02050c"/>
    </radialGradient>
    <radialGradient id="core" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fff4c1" stop-opacity=".98"/>
      <stop offset=".12" stop-color="#ffd474" stop-opacity=".92"/>
      <stop offset=".34" stop-color="#f0a43e" stop-opacity=".7"/>
      <stop offset=".68" stop-color="#a86127" stop-opacity=".34"/>
      <stop offset="1" stop-color="#305b82" stop-opacity=".12"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2=".16">
      <stop offset="0" stop-color="#75c8ff" stop-opacity="0"/>
      <stop offset=".17" stop-color="#70caff" stop-opacity=".68"/>
      <stop offset=".34" stop-color="#f8b550" stop-opacity=".96"/>
      <stop offset=".49" stop-color="#fff0bd"/>
      <stop offset=".63" stop-color="#f4a53d" stop-opacity=".96"/>
      <stop offset=".82" stop-color="#61b5fb" stop-opacity=".68"/>
      <stop offset="1" stop-color="#75c8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diskUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa73c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffb64d" stop-opacity=".8"/>
      <stop offset="1" stop-color="#45a8f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neural" x1=".08" y1=".9" x2=".92" y2=".1">
      <stop offset="0" stop-color="#70c8ff" stop-opacity=".75"/>
      <stop offset=".38" stop-color="#f2a944" stop-opacity=".94"/>
      <stop offset=".7" stop-color="#ffe5a3" stop-opacity=".98"/>
      <stop offset="1" stop-color="#75caff" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="horizon" cx="48%" cy="45%" r="65%">
      <stop offset="0" stop-color="#000104"/>
      <stop offset=".73" stop-color="#010308"/>
      <stop offset=".92" stop-color="#050912"/>
      <stop offset="1" stop-color="#162233"/>
    </radialGradient>
    <filter id="blur40" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur18" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur7" x="-20%" y="-35%" width="140%" height="170%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brightGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/><feColorMatrix in="b" type="saturate" values="1.5" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphereClip"><circle cx="800" cy="500" r="316"/></clipPath>
    <pattern id="stars" width="190" height="160" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="24" r="1.4" fill="#d8e9ff" opacity=".55"/><circle cx="74" cy="112" r="1" fill="#fff1ca" opacity=".6"/>
      <circle cx="146" cy="41" r="1.2" fill="#b6dfff" opacity=".5"/><circle cx="171" cy="138" r=".8" fill="#fff" opacity=".5"/>
      <circle cx="109" cy="75" r=".7" fill="#fff" opacity=".42"/><circle cx="35" cy="151" r=".7" fill="#8bbde9" opacity=".55"/>
    </pattern>
  </defs>

  <!-- Deep, restrained navy space keeps the central phenomenon unmistakable. -->
  <rect width="1600" height="1000" fill="url(#space)"/>
  <rect width="1600" height="1000" fill="url(#stars)" opacity=".62"/>
  <ellipse cx="800" cy="500" rx="520" ry="300" fill="#f09b36" opacity=".11" filter="url(#blur40)"/>
  <ellipse cx="800" cy="500" rx="540" ry="350" fill="#4ca8ec" opacity=".08" filter="url(#blur40)"/>

  <!-- Broad gravitationally bent disk, with cool edges and a hot gold-white core. -->
  <ellipse cx="800" cy="500" rx="620" ry="145" fill="none" stroke="#e99537" stroke-width="62" opacity=".24" filter="url(#blur40)"/>
  <ellipse cx="800" cy="500" rx="570" ry="126" fill="none" stroke="#52b7ff" stroke-width="28" opacity=".26" filter="url(#blur18)"/>
  <path d="M176 500 C360 365 575 350 800 420 C1025 350 1240 365 1424 500 C1240 635 1025 650 800 580 C575 650 360 635 176 500Z" fill="none" stroke="url(#diskUnder)" stroke-width="11" opacity=".86" filter="url(#blur7)"/>
  <path d="M163 500 C352 405 574 394 800 444 C1026 394 1248 405 1437 500 C1248 595 1026 606 800 556 C574 606 352 595 163 500Z" fill="none" stroke="url(#disk)" stroke-width="5" opacity=".86" filter="url(#glow)"/>
  <path d="M211 500 C393 433 600 429 800 464 C1000 429 1207 433 1389 500" fill="none" stroke="#fff4d0" stroke-width="2" opacity=".88"/>
  <path d="M220 500 C405 555 605 562 800 535 C995 562 1195 555 1380 500" fill="none" stroke="#73c7ff" stroke-width="2" opacity=".72"/>

  <!-- Neural globe: warm synaptic filaments and cool orbital paths share one sphere. -->
  <circle cx="800" cy="500" r="316" fill="url(#core)" opacity=".72"/>
  <circle cx="800" cy="500" r="316" fill="none" stroke="#ffd17b" stroke-width="2" opacity=".52" filter="url(#glow)"/>
  <g clip-path="url(#sphereClip)" fill="none" stroke="url(#neural)" stroke-width="1.7" opacity=".82">
    <ellipse cx="800" cy="500" rx="300" ry="116" transform="rotate(-24 800 500)"/>
    <ellipse cx="800" cy="500" rx="304" ry="144" transform="rotate(29 800 500)"/>
    <ellipse cx="800" cy="500" rx="292" ry="180" transform="rotate(72 800 500)"/>
    <ellipse cx="800" cy="500" rx="287" ry="206" transform="rotate(-66 800 500)"/>
    <ellipse cx="800" cy="500" rx="248" ry="286" transform="rotate(14 800 500)"/>
    <ellipse cx="800" cy="500" rx="220" ry="305" transform="rotate(-17 800 500)"/>
    <path d="M485 500 C590 435 665 540 745 468 S879 413 944 502 1053 548 1115 464"/>
    <path d="M505 410 C597 502 648 390 730 442 S861 561 930 462 1038 404 1094 570"/>
    <path d="M516 584 C612 535 661 615 740 548 S866 407 941 536 1033 590 1086 430"/>
    <path d="M566 350 C626 438 684 409 751 495 S851 604 909 547 1009 401 1040 351"/>
    <path d="M565 646 C624 549 683 572 747 495 S856 387 921 449 1000 563 1042 646"/>
  </g>

  <!-- Dense synapses form an intelligent halo around the singularity. -->
  <g fill="#ffe2a0" filter="url(#glow)">
    <circle cx="519" cy="435" r="4"/><circle cx="566" cy="569" r="3"/><circle cx="592" cy="390" r="3.2"/>
    <circle cx="622" cy="515" r="4.2"/><circle cx="649" cy="620" r="3"/><circle cx="675" cy="424" r="3.6"/>
    <circle cx="699" cy="573" r="3.5"/><circle cx="724" cy="350" r="3"/><circle cx="743" cy="462" r="4"/>
    <circle cx="762" cy="605" r="3.2"/><circle cx="839" cy="383" r="3.7"/><circle cx="858" cy="583" r="4"/>
    <circle cx="884" cy="465" r="3.2"/><circle cx="914" cy="347" r="3"/><circle cx="936" cy="560" r="4"/>
    <circle cx="958" cy="432" r="3.5"/><circle cx="991" cy="602" r="3"/><circle cx="1017" cy="478" r="4"/>
    <circle cx="1052" cy="392" r="3"/><circle cx="1083" cy="553" r="3.6"/>
  </g>
  <g fill="#8ad4ff" filter="url(#glow)">
    <circle cx="541" cy="527" r="2.8"/><circle cx="601" cy="638" r="2.5"/><circle cx="647" cy="366" r="2.5"/>
    <circle cx="713" cy="652" r="2.7"/><circle cx="753" cy="392" r="2.5"/><circle cx="874" cy="638" r="2.8"/>
    <circle cx="926" cy="381" r="2.5"/><circle cx="986" cy="346" r="2.6"/><circle cx="1048" cy="623" r="2.7"/>
    <circle cx="1100" cy="452" r="2.6"/>
  </g>

  <!-- Event horizon and the curved photon ring sit inside the neural structure. -->
  <ellipse cx="800" cy="500" rx="214" ry="89" fill="none" stroke="#f7a33f" stroke-width="25" opacity=".24" filter="url(#blur18)"/>
  <ellipse cx="800" cy="500" rx="210" ry="86" fill="none" stroke="url(#disk)" stroke-width="8" opacity=".96" filter="url(#brightGlow)"/>
  <ellipse cx="800" cy="500" rx="181" ry="73" fill="none" stroke="#fff0c4" stroke-width="2" opacity=".82"/>
  <circle cx="800" cy="500" r="145" fill="url(#horizon)"/>
  <circle cx="800" cy="500" r="141" fill="none" stroke="#050a12" stroke-width="7"/>
  <ellipse cx="800" cy="500" rx="147" ry="56" fill="none" stroke="#f7d792" stroke-width="1.8" opacity=".68"/>
  <ellipse cx="800" cy="500" rx="153" ry="62" fill="none" stroke="#72c7ff" stroke-width="1.3" opacity=".58"/>
  <circle cx="800" cy="500" r="109" fill="#000105"/>
  <circle cx="800" cy="500" r="109" fill="none" stroke="#111d2b" stroke-width="2"/>
  <ellipse cx="800" cy="500" rx="116" ry="42" fill="none" stroke="#f5b44f" stroke-width="2" opacity=".42"/>

  <!-- Fine orbital sparks and a subtle central glint. -->
  <g fill="#fff5d5" filter="url(#brightGlow)">
    <circle cx="596" cy="475" r="3.4"/><circle cx="1006" cy="526" r="3.6"/>
    <circle cx="704" cy="430" r="2.5"/><circle cx="909" cy="571" r="2.4"/>
  </g>
  <path d="M789 500h22M800 489v22" stroke="#f8d899" stroke-width="1" opacity=".5"/>

  <!-- Minimal concept label, deliberately secondary to the core. -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="884" fill="#d6e3f2" font-size="15" letter-spacing="6" opacity=".68">ZÆNIA  /  NEURAL CORE</text>
    <text x="800" y="915" fill="#8aa0b7" font-size="11" letter-spacing="4" opacity=".62">SINGULARITY CONCEPT</text>
  </g>
</svg>
